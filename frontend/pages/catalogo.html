<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - TechMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TechMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link active" href="catalogo.html">Productos</a>
                    <a class="nav-link" href="servicios.html">Servicios</a>
                    <a class="nav-link" href="carrito.html">Carrito</a>
                    <a class="nav-link" href="historial.html">Mis Pedidos</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card p-3 shadow-sm">
                    <h5 class="mb-3"><i class="bi bi-funnel"></i> Filtros</h5>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Buscar</label>
                        <input type="text" id="busqueda" class="form-control" placeholder="Nombre o descripción...">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Categoría</label>
                        <select id="filtro-categoria" class="form-select">
                            <option value="">Todas</option>
                            <option value="Laptops">Laptops</option>
                            <option value="Smartphones">Smartphones</option>
                            <option value="Monitores">Monitores</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Precio Máximo: $<span id="precio-valor">1000</span></label>
                        <input type="range" class="form-range" id="filtro-precio" min="0" max="2000" step="50" value="1000">
                    </div>

                    <button id="btn-limpiar" class="btn btn-outline-secondary w-100 btn-sm">Limpiar Filtros</button>
                </div>

                <div class="d-grid mt-3">
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalProducto">
                        + Nuevo Producto
                    </button>
                </div>
            </div>

            <div class="col-md-9">
                <h3 class="mb-3">Catálogo de Productos</h3>
                <div id="lista-productos" class="row">
                    </div>
                <div id="mensaje-no-resultados" class="alert alert-warning d-none">
                    No se encontraron productos con esos filtros.
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Registrar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-producto">
                        <div class="mb-2"><input type="text" id="nombre" class="form-control" placeholder="Nombre del producto" required></div>
                        <div class="mb-2"><textarea id="desc" class="form-control" placeholder="Descripción"></textarea></div>
                        <div class="row mb-2">
                            <div class="col"><input type="number" id="precio" class="form-control" placeholder="Precio ($)" required></div>
                            <div class="col"><input type="number" id="stock" class="form-control" placeholder="Stock" required></div>
                        </div>
                        <div class="mb-3">
                            <select id="cat" class="form-select" required>
                                <option value="">Seleccione Categoría...</option>
                                <option value="Laptops">Laptops</option>
                                <option value="Smartphones">Smartphones</option>
                                <option value="Monitores">Monitores</option>
                                <option value="Accesorios">Accesorios</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">URL de Imagen (Opcional)</label>
                            <input type="text" id="img-url" class="form-control" placeholder="http://...">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Publicar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/productos.js"></script>
</body>
</html>
