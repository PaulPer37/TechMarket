<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos - TechMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">TechMarket</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="catalogo.html">Productos</a>
                <a class="nav-link" href="servicios.html">Servicios</a>
                <a class="nav-link" href="carrito.html">Carrito</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card mb-4">
            <div class="card-header bg-secondary text-white">Registrar Nuevo Producto</div>
            <div class="card-body">
                <form id="form-producto">
                    <div class="row">
                        <div class="col-md-3"><input type="text" id="nombre" class="form-control" placeholder="Nombre" required></div>
                        <div class="col-md-3"><input type="text" id="desc" class="form-control" placeholder="Descripción"></div>
                        <div class="col-md-2"><input type="number" id="precio" class="form-control" placeholder="Precio" required></div>
                        <div class="col-md-2"><input type="number" id="stock" class="form-control" placeholder="Stock" required></div>
                        <div class="col-md-2"><input type="text" id="cat" class="form-control" placeholder="Categoría"></div>
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Publicar Producto</button>
                </form>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <select id="filtro-categoria" class="form-select">
                    <option value="">Todas las categorías</option>
                    <option value="Laptops">Laptops</option>
                    <option value="Smartphones">Smartphones</option>
                </select>
            </div>
        </div>

        <div id="lista-productos" class="row"></div>
    </div>

    <script src="../js/productos.js"></script>
</body>
</html>
