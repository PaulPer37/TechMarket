<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - TechMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TechMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link" href="catalogo.html">Productos</a>
                    <a class="nav-link active" href="servicios.html">Servicios</a>
                    <a class="nav-link" href="carrito.html">Carrito</a>
                    <a class="nav-link" href="historial.html">Mis Pedidos</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-8">
                <h3>Servicios Técnicos</h3>
                <p class="text-muted">Encuentra los mejores servicios técnicos profesionales</p>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevoServicio">
                    + Nuevo Servicio
                </button>
            </div>
        </div>

        <!-- Grid de servicios (DINÁMICO) -->
        <div class="row g-4" id="lista-servicios">
            <!-- Los servicios se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Modal para publicar nuevo servicio -->
    <div class="modal fade" id="modalNuevoServicio" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Publicar Nuevo Servicio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-servicio">
                        <div class="mb-2">
                            <input type="text" class="form-control" id="titulo" placeholder="Nombre del Servicio" required>
                        </div>
                        <div class="mb-2">
                            <textarea class="form-control" id="desc" rows="3" placeholder="Descripción" required></textarea>
                        </div>
                        <div class="mb-2">
                            <input type="number" class="form-control" id="costo" placeholder="Precio ($)" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" id="horario" placeholder="Horario de Atención (Ej: Lun-Vie 9am-6pm)" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Publicar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/servicios.js"></script>
</body>
</html>
